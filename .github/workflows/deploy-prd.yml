name: CD - Deploy Production

on:
  release:
    types:
      - published

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  FIREBASE_PROJECT_ID: "mandaumpix-app-prd"

jobs:
  deploy:
    name: Build e Deploy (Production)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mandaumpix.app
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências (lockfile estrito)
        run: npm ci

      - name: Verificar formatação de código (Prettier)
        run: npm run format:check

      - name: Executar análise estática (ESLint)
        run: npm run lint

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Gerar build de produção (JSPM)
        run: npm run build

      - name: Deploy no Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRD }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
