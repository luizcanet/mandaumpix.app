name: CD - Deploy Staging

on:
  push:
    branches:
      - "release/**"
      - "hotfix/**"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  FIREBASE_PROJECT_ID: "mandaumpix-app-stg"

jobs:
  deploy:
    name: Build e Deploy (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://stg.mandaumpix.app
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências (lockfile estrito)
        run: npm ci

      - name: Verificar formatação de código (Prettier)
        run: npm run format:check

      - name: Executar análise estática (ESLint)
        run: npm run lint

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Gerar build de produção (JSPM)
        run: npm run build

      - name: Gerar build do Storybook (dist/storybook)
        run: npm run build-storybook -- -o dist/storybook

      - name: Regenerar checksums dos artefatos (dist/SHA256SUMS)
        run: npm run build:checksums

      - name: Verificar integridade criptográfica dos artefatos compilados (INV-02)
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publicar checksums como artefato de pipeline
        uses: actions/upload-artifact@v4
        with:
          name: sha256sums-stg
          path: dist/SHA256SUMS
          retention-days: 30

      - name: Deploy no Firebase Hosting (Staging)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STG }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
